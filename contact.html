<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Campeón GPT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <form action="https://formsubmit.co/sahidattaf@gmail.com" method="POST" onsubmit="notifyTelegram();">
    <h2>💬 Contact Campeón GPT</h2>
    <input type="hidden" name="_subject" value="New Campeón GPT Form Submission!">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">

    <label for="name">Name</label>
    <input type="text" name="name" required>

    <label for="email">Email</label>
    <input type="email" name="email" required>

    <label for="company">Business or Project Name</label>
    <input type="text" name="company">

    <label for="gpt">GPT Interested In</label>
    <select name="gpt">
      <option value="PISKA GPT">PISKA GPT</option>
      <option value="TRAPI GPT">TRAPI GPT</option>
      <option value="KONOSÉ GPT">KONOSÉ GPT</option>
      <option value="TRENA GPT">TRENA GPT</option>
      <option value="GROW GPT">GROW GPT</option>
      <option value="BISTA GPT">BISTA GPT</option>
    </select>

    <label for="message">Message</label>
    <textarea name="message" rows="4"></textarea>

    <button type="submit">📨 Send Request</button>
  </form>

  <script src="js/config.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
